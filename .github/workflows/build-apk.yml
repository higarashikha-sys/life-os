name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # Touch the cached signing key twice a week so GitHub does not evict it after 7 days of inactivity.
    - cron: '17 3 * * 1,4'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lifeos-debug-keystore-v1
      - name: Create debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=LifeOS,C=JP"
          fi
      - name: Signing diagnostics
        if: github.event_name != 'schedule'
        run: |
          {
            echo "HOME=$HOME"
            echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-}"
            echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-}"
            echo "Cached keystore:"
            ls -l "$HOME/.android/debug.keystore" || true
            sha256sum "$HOME/.android/debug.keystore" || true
            echo
            echo "Gradle signing report:"
            gradle :app:signingReport
          } > signing-diagnostics.txt 2>&1
      - name: Upload signing diagnostics
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-signing-diagnostics
          path: signing-diagnostics.txt
      - name: Build debug APK
        if: github.event_name != 'schedule'
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: LifeOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
