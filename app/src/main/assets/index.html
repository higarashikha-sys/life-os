<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life OS</title>
<style>
:root{--bg:#f4f1eb;--p:#fff;--t:#202326;--m:#6d7479;--l:#ded9cf;--a:#455a64}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,-apple-system,sans-serif}.app{max-width:900px;margin:auto;padding:14px 12px 80px}nav{display:flex;gap:7px;overflow:auto;margin:10px 0 14px}button,input,textarea,select{font:inherit}button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:9px 12px;min-height:42px}button.on,.primary{background:var(--a);color:#fff}input,textarea,select{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}textarea{min-height:88px}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 12;background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.half{grid-column:span 6}.muted{color:var(--m);font-size:13px}.item{padding:10px 0;border-top:1px solid #eee}.item:first-child{border-top:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.pill{font-size:12px;background:#edf0f1;border-radius:999px;padding:2px 7px}.resume{border-left:3px solid var(--a);background:#f4f6f6;padding:11px;border-radius:8px}.stack{display:grid;gap:9px}.subcard{border:1px solid var(--l);border-radius:12px;padding:12px;background:#faf9f6}.taskmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}h2,h3{margin:0 0 10px}@media(max-width:680px){.half{grid-column:span 12}}
</style></head><body><div class="app"><h1 style="margin:4px 0 0;font-size:24px">Life OS</h1><div class="muted" id="date"></div><nav id="nav"></nav>
<section class="panel on" data-p="today"></section><section class="panel" data-p="inbox"></section><section class="panel" data-p="habits"></section><section class="panel" data-p="projects"></section><section class="panel" data-p="journal"></section><section class="panel" data-p="history"></section><section class="panel" data-p="review"></section><section class="panel" data-p="settings"></section></div>
<script>
(()=>{const K='lifeos_v1',tabs=[['today','Today'],['inbox','Inbox'],['habits','Life'],['projects','Works'],['journal','Diary'],['history','History'],['review','Review'],['settings','Setting']],$=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),pad=n=>String(n).padStart(2,'0'),localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,day=()=>localDate(new Date()),now=()=>new Date().toISOString(),isoDay=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?String(v||'').slice(0,10):localDate(d)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return{version:2,tasks:[],inbox:[],habits:[{id:uid(),name:'朝食',target:7,logs:{}},{id:uid(),name:'読書',target:5,logs:{}}],projects:[{id:uid(),name:'研究',sessions:[]},{id:uid(),name:'読書',sessions:[]}],journal:[]}}
let S;try{S=JSON.parse(localStorage.getItem(K))||fresh()}catch(e){S=fresh()}S.version=2;S.tasks=S.tasks||[];S.inbox=S.inbox||[];S.habits=S.habits||[];S.projects=S.projects||[];S.journal=S.journal||[];let cp=S.projects[0]?.id;const save=()=>localStorage.setItem(K,JSON.stringify(S));
$('#date').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('#nav').innerHTML=tabs.map((x,i)=>`<button data-tab="${x[0]}" class="${i?'':'on'}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.dataset.p===id));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));render(id)}
function render(id){({today,inbox,habits,projects,journal,history,review,settings}[id]||(()=>{}))()}
function taskMeta(t){return `<div class="taskmeta"><span class="pill">${t.minutes||20}分</span><span class="pill">${t.focus==='high'?'高集中':t.focus==='low'?'低集中':'普通'}</span>${t.category?`<span class="pill">${esc(t.category)}</span>`:''}${t.due?`<span class="pill">期限 ${esc(t.due)}</span>`:''}</div>`}
function today(){const p=$('[data-p=today]'),last=S.projects.map(x=>({p:x,s:[...(x.sessions||[])].sort((a,b)=>b.at.localeCompare(a.at))[0]})).filter(x=>x.s);p.innerHTML=`<div class="grid"><div class="card half"><h2>今日</h2><div class="stack"><input id="newTask" placeholder="今日やること"><div class="row"><select id="mins"><option>10</option><option selected>20</option><option>30</option><option>60</option></select><select id="focus"><option value="low">低集中</option><option value="mid" selected>普通</option><option value="high">高集中</option></select><button class="primary" id="addTask">追加</button></div></div><div id="tasks">${S.tasks.filter(t=>!t.done).map(t=>`<div class="item"><label><input type="checkbox" data-done="${t.id}"> <b>${esc(t.text)}</b></label>${taskMeta(t)}</div>`).join('')||'<div class="muted item">未完了タスクなし</div>'}</div></div><div class="card half"><h3>前回の続き</h3>${last.map(x=>`<div class="item"><b>${esc(x.p.name)}</b><div class="muted">${new Date(x.s.at).toLocaleString('ja-JP')}</div><div>${esc(x.s.next||'次の一手未記録')}</div><button data-open="${x.p.id}">続きから開く</button></div>`).join('')||'<div class="muted">まだ記録なし</div>'}</div><div class="card"><h3>習慣</h3>${S.habits.map(h=>`<button data-habit="${h.id}">${h.logs?.[day()]?'✓ ':''}${esc(h.name)}</button>`).join(' ')}</div></div>`;$('#addTask').onclick=()=>{const v=$('#newTask').value.trim();if(!v)return;S.tasks.push({id:uid(),text:v,minutes:+$('#mins').value,focus:$('#focus').value,createdAt:now(),done:false});save();today()};document.querySelectorAll('[data-done]').forEach(c=>c.onchange=()=>{const t=S.tasks.find(x=>x.id===c.dataset.done);if(!t)return;t.done=true;t.doneAt=now();save();today()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{cp=b.dataset.open;show('projects')});document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{const h=S.habits.find(x=>x.id===b.dataset.habit);if(!h)return;h.logs=h.logs||{};h.logs[day()]?delete h.logs[day()]:h.logs[day()]=now();save();today()})}
function inbox(){const p=$('[data-p=inbox]');p.innerHTML=`<div class="grid"><div class="card half"><h2>Inbox</h2><p class="muted">思いつきを未整理のまま置く場所です。</p><div class="row"><input id="ib" placeholder="思いつきをそのまま入力"><button id="ibAdd" class="primary">追加</button></div><h3 style="margin-top:16px">未整理</h3>${S.inbox.map((x,i)=>`<div class="item"><b>${esc(typeof x==='string'?x:x.text)}</b><div style="margin-top:7px"><button data-taskify="${i}">詳細タスクへ転記</button></div></div>`).join('')||'<div class="muted item">未整理項目なし</div>'}</div><div class="card half"><h2>詳細タスクを追加</h2><p class="muted" id="ibSource">未整理項目の「詳細タスクへ転記」を押すと、ここへ内容を移して編集できます。直接入力も可能です。</p><input id="ibIndex" type="hidden" value=""><div class="stack"><input id="dtText" placeholder="タスク名"><div class="row"><select id="dtMinutes"><option value="5">5分</option><option value="10">10分</option><option value="20" selected>20分</option><option value="30">30分</option><option value="60">60分</option><option value="90">90分</option></select><select id="dtFocus"><option value="low">低集中</option><option value="mid" selected>普通</option><option value="high">高集中</option></select></div><input id="dtCategory" placeholder="分類（例：家事・買い物・手続き）"><label class="muted">期限<input id="dtDue" type="date"></label><div class="row"><button id="dtAdd" class="primary">未完了タスクに追加</button><button id="dtClear">入力をクリア</button></div></div><h3 style="margin-top:18px">未完了タスク</h3>${S.tasks.filter(t=>!t.done).map(t=>`<div class="item"><b>${esc(t.text)}</b>${taskMeta(t)}</div>`).join('')||'<div class="muted item">未完了タスクなし</div>'}</div></div>`;$('#ibAdd').onclick=()=>{const v=$('#ib').value.trim();if(v){S.inbox.push(v);save();inbox()}};document.querySelectorAll('[data-taskify]').forEach(b=>b.onclick=()=>{const i=+b.dataset.taskify,v=S.inbox[i],text=typeof v==='string'?v:v.text;$('#dtText').value=text||'';$('#ibIndex').value=String(i);$('#ibSource').textContent=`未整理から転記中：${text}`;$('#dtText').focus()});$('#dtClear').onclick=()=>{$('#dtText').value='';$('#dtMinutes').value='20';$('#dtFocus').value='mid';$('#dtCategory').value='';$('#dtDue').value='';$('#ibIndex').value='';$('#ibSource').textContent='未整理項目の「詳細タスクへ転記」を押すと、ここへ内容を移して編集できます。直接入力も可能です。'};$('#dtAdd').onclick=()=>{const text=$('#dtText').value.trim();if(!text)return;S.tasks.push({id:uid(),text,minutes:+$('#dtMinutes').value||20,focus:$('#dtFocus').value,category:$('#dtCategory').value.trim(),due:$('#dtDue').value||'',createdAt:now(),done:false});const src=$('#ibIndex').value;if(src!==''&&S.inbox[+src]!==undefined)S.inbox.splice(+src,1);save();inbox()}}
function habits(){const p=$('[data-p=habits]');p.innerHTML=`<div class="grid"><div class="card half"><h2>Life</h2><p class="muted">生活習慣の記録と実行率。</p>${S.habits.map(h=>`<div class="item"><b>${esc(h.name)}</b><div class="muted">目標 週${h.target}回 / 全記録 ${Object.keys(h.logs||{}).length}回</div></div>`).join('')}</div><div class="card half"><h3>習慣を追加</h3><input id="hn" placeholder="習慣名"><select id="ht"><option value="3">週3回</option><option value="5">週5回</option><option value="7">毎日</option></select><button id="ha">追加</button></div></div>`;$('#ha').onclick=()=>{const n=$('#hn').value.trim();if(n){S.habits.push({id:uid(),name:n,target:+$('#ht').value,logs:{}});save();habits()}}}
function projects(){const p=$('[data-p=projects]'),x=S.projects.find(z=>z.id===cp)||S.projects[0];cp=x?.id;const last=x?[...(x.sessions||[])].sort((a,b)=>b.at.localeCompare(a.at))[0]:null;p.innerHTML=`<div class="grid"><div class="card half"><h2>Works</h2><p class="muted">研究・読書・趣味など、続きを残したい作業をプロジェクト単位で管理します。</p>${S.projects.map(z=>`<button data-pr="${z.id}" class="${z.id===cp?'primary':''}">${esc(z.name)}</button>`).join(' ')}<hr><input id="pn" placeholder="新規プロジェクト名"><button id="pa">追加</button></div><div class="card half">${x?`<h2>${esc(x.name)}</h2>${last?`<div class="resume"><b>前回の続き</b><br><span class="muted">${new Date(last.at).toLocaleString('ja-JP')}</span><p><b>やったこと</b><br>${esc(last.done)}</p><p><b>考えていたこと</b><br>${esc(last.thinking)}</p><p><b>次の一手</b><br>${esc(last.next)}</p></div>`:'<div class="resume">まだ記録なし</div>'}<div class="stack" style="margin-top:12px"><textarea id="pd" placeholder="今日やったこと"></textarea><textarea id="pth" placeholder="今考えていること"></textarea><textarea id="pnx" placeholder="次に見る場所・次の一手"></textarea><label class="muted">作業時間（分）<input id="pm" type="number" value="30" min="0" max="600"></label><button id="ps" class="primary">終了メモを保存</button></div><h3 style="margin-top:16px">過去の思考履歴</h3>${[...(x.sessions||[])].sort((a,b)=>b.at.localeCompare(a.at)).map(s=>`<div class="item"><span class="muted">${new Date(s.at).toLocaleString('ja-JP')} ・ ${s.minutes||0}分</span><p><b>やったこと</b><br>${esc(s.done)}</p><p><b>考えていたこと</b><br>${esc(s.thinking)}</p><p><b>次の一手</b><br>${esc(s.next)}</p></div>`).join('')}`:'プロジェクトなし'}</div></div>`;document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{cp=b.dataset.pr;projects()});$('#pa').onclick=()=>{const n=$('#pn').value.trim();if(n){const id=uid();S.projects.push({id,name:n,sessions:[]});cp=id;save();projects()}};if(x)$('#ps').onclick=()=>{const done=$('#pd').value.trim(),thinking=$('#pth').value.trim(),next=$('#pnx').value.trim();if(!done&&!thinking&&!next)return;x.sessions=x.sessions||[];x.sessions.push({id:uid(),at:now(),done,thinking,next,minutes:+$('#pm').value||0});save();projects()}}
function journal(selectedDate){const p=$('[data-p=journal]'),k=selectedDate||p.dataset.editDate||day();p.dataset.editDate=k;const j=S.journal.find(x=>x.date===k)||{};p.innerHTML=`<div class="grid"><div class="card half"><h2>Diary</h2><label class="muted">記録する日付<input id="jdate" type="date" max="${day()}" value="${esc(k)}"></label><div class="stack" style="margin-top:10px"><textarea id="jd" placeholder="その日にやったこと">${esc(j.done)}</textarea><textarea id="js" placeholder="気分・疲労・集中">${esc(j.state)}</textarea><textarea id="jn" placeholder="気づき・考え">${esc(j.note)}</textarea><textarea id="jx" placeholder="次の日・次回の最初の一手">${esc(j.next)}</textarea><button id="jSave" class="primary">${j.date?'この日の日記を更新':'この日の日記を保存'}</button></div></div><div class="card half"><h3>過去の日記</h3><p class="muted">日付を押すと、その日の内容を編集できます。</p>${[...S.journal].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map(x=>`<div class="item"><button data-jopen="${x.date}">${x.date}</button><div style="margin-top:5px">${esc(x.note||x.done||x.state)}</div></div>`).join('')||'<div class="muted item">まだ日記なし</div>'}</div></div>`;$('#jdate').onchange=()=>journal($('#jdate').value||day());document.querySelectorAll('[data-jopen]').forEach(b=>b.onclick=()=>journal(b.dataset.jopen));$('#jSave').onclick=()=>{const date=$('#jdate').value;if(!date||date>day())return;const o={date,done:$('#jd').value.trim(),state:$('#js').value.trim(),note:$('#jn').value.trim(),next:$('#jx').value.trim()};const i=S.journal.findIndex(x=>x.date===date);i>=0?S.journal[i]=o:S.journal.push(o);save();journal(date)}}
function rows(){let a=[];S.tasks.forEach(t=>a.push({type:'Task',date:isoDay(t.doneAt||t.createdAt),title:t.text,body:[t.done?'完了':'未完了',t.category||'',t.due?`期限 ${t.due}`:''].join(' ')}));S.projects.forEach(p=>(p.sessions||[]).forEach(s=>a.push({type:'Works',date:isoDay(s.at),title:p.name,body:[s.done,s.thinking,s.next].join(' ')})));S.journal.forEach(j=>a.push({type:'Diary',date:j.date,title:j.date,body:[j.done,j.state,j.note,j.next].join(' ')}));return a.sort((x,y)=>y.date.localeCompare(x.date))}
function history(){const p=$('[data-p=history]');p.innerHTML=`<div class="card"><h2>History</h2><input id="hq" placeholder="Diary・Works・Taskを横断検索"><div id="hr"></div></div>`;const go=()=>{const q=$('#hq').value.toLowerCase();$('#hr').innerHTML=rows().filter(x=>!q||(x.title+' '+x.body+' '+x.type).toLowerCase().includes(q)).slice(0,300).map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="pill">${esc(x.type)}</span><div class="muted">${x.date}</div><div>${esc(x.body)}</div></div>`).join('')||'<div class="muted item">該当なし</div>'};$('#hq').oninput=go;go()}
function review(){const p=$('[data-p=review]'),todayD=new Date(),cut=new Date(todayD.getFullYear(),todayD.getMonth(),todayD.getDate()-6),cutKey=localDate(cut),done=S.tasks.filter(x=>x.done&&isoDay(x.doneAt)>=cutKey).length,recentSessions=S.projects.flatMap(x=>(x.sessions||[]).map(s=>({p:x,s}))).filter(x=>isoDay(x.s.at)>=cutKey),minutes=recentSessions.reduce((n,x)=>n+(+x.s.minutes||0),0),recentJournal=S.journal.filter(x=>x.date>=cutKey&&x.date<=day()),tired=recentJournal.filter(x=>/疲|眠|集中でき|だる|しんど/.test((x.state||'')+' '+(x.note||''))).length,stale=S.tasks.filter(x=>!x.done&&isoDay(x.createdAt)<cutKey).length,habitLogs=S.habits.reduce((n,h)=>n+Object.keys(h.logs||{}).filter(d=>d>=cutKey&&d<=day()).length,0),habitTargets=S.habits.reduce((n,h)=>n+Math.min(7,+h.target||0),0),habitPct=habitTargets?Math.round(habitLogs/habitTargets*100):0;let ideas=[];if(tired>=2)ideas.push('この7日間の日記に疲労・眠気・集中低下の記述が複数あります。高集中のWorksを、状態のよい時間帯へ移す候補があります。');if(stale>=2)ideas.push(`7日以上未完了のタスクが${stale}件あります。期限・所要時間を見直すか、不要なら削除候補にしてください。`);if(recentSessions.length===0&&S.projects.length)ideas.push('この7日間にWorksの終了メモがありません。長時間枠ではなく、再開だけを目的に15〜20分確保する方法があります。');if(habitPct<50&&habitTargets)ideas.push(`習慣の7日間実行率は約${habitPct}%です。実行しにくい習慣を1つ選び、時刻や直前行動を固定する余地があります。`);if(!ideas.length)ideas.push('現時点では強い停滞パターンを検出していません。記録が増えるほど、同じ曜日・時間帯・疲労状態との関係を検討しやすくなります。');p.innerHTML=`<div class="grid"><div class="card half"><h2>Review</h2><p class="muted">APK内で動作します。外部AIではなく、端末内の直近7日間の記録を集計・判定しています。</p><div class="item">完了タスク <b>${done}</b></div><div class="item">Works記録 <b>${recentSessions.length}</b>回 / <b>${minutes}</b>分</div><div class="item">Diary <b>${recentJournal.length}</b>日</div><div class="item">習慣実行率 <b>${habitPct}%</b></div></div><div class="card half"><h3>改善候補</h3>${ideas.map(x=>`<div class="resume" style="margin-bottom:9px">${esc(x)}</div>`).join('')}</div></div>`}
function settings(){const p=$('[data-p=settings]');p.innerHTML=`<div class="card"><h2>Setting</h2><p class="muted">記録は端末内に保存します。定期的にJSONを書き出してください。</p><div class="row"><button id="ex" class="primary">JSONを書き出す</button><button id="im">JSONを読み込む</button></div><div class="item"><b>Reviewについて</b><div class="muted">現在は外部AIへデータを送らず、APK内のJavaScriptが端末内記録を分析します。</div></div></div>`;$('#ex').onclick=()=>{const j=JSON.stringify(S,null,2);if(window.AndroidBridge?.exportBackup)AndroidBridge.exportBackup(j)};$('#im').onclick=()=>window.AndroidBridge?.importBackup()}
window.receiveImportedBackupBase64=b=>{try{const txt=new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))),o=JSON.parse(txt);if(!o.version)throw 0;S=o;S.tasks=S.tasks||[];S.inbox=S.inbox||[];S.habits=S.habits||[];S.projects=S.projects||[];S.journal=S.journal||[];S.version=2;save();cp=S.projects[0]?.id;show('today')}catch(e){window.AndroidBridge?.toast('読み込みに失敗しました')}};today();save();})();
</script></body></html>
