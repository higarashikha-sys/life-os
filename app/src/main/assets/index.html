<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life OS</title>
<style>
:root{--bg:#f4f1eb;--panel:#fff;--text:#202326;--muted:#6d7479;--line:#ded9cf;--accent:#455a64;--danger:#8a3d3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
.app{max-width:900px;margin:auto;padding:34px 12px 80px;padding-top:max(34px,calc(env(safe-area-inset-top) + 18px))}
h1{margin:0;font-size:24px}
h2,h3{margin:0 0 10px}
nav{display:flex;gap:7px;overflow:auto;margin:10px 0 14px;padding-bottom:2px}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:42px;cursor:pointer}
button.on,.primary{background:var(--accent);color:#fff}
button.danger{color:var(--danger);border-color:#d8bcbc}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:88px;resize:vertical}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.half{grid-column:span 6}
.muted{color:var(--muted);font-size:13px}
.item{padding:10px 0;border-top:1px solid #eee}.item:first-child{border-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}
.stack{display:grid;gap:9px}
.pill{display:inline-block;font-size:12px;background:#edf0f1;border-radius:999px;padding:2px 7px}
.taskmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.resume{border-left:3px solid var(--accent);background:#f4f6f6;padding:11px;border-radius:8px}
.manage{display:flex;justify-content:space-between;align-items:center;gap:10px}
.smallbtn{min-height:34px;padding:5px 10px;font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media(max-width:680px){.half{grid-column:span 12}}
</style>
</head>
<body>
<div class="app">
  <h1>Life OS</h1>
  <div class="muted" id="date"></div>
  <nav id="nav"></nav>
  <section class="panel on" data-p="today"></section>
  <section class="panel" data-p="inbox"></section>
  <section class="panel" data-p="habits"></section>
  <section class="panel" data-p="projects"></section>
  <section class="panel" data-p="journal"></section>
  <section class="panel" data-p="history"></section>
  <section class="panel" data-p="review"></section>
  <section class="panel" data-p="settings"></section>
</div>
<script>
(()=>{
const KEY='lifeos_v1';
const tabs=[['today','Today'],['inbox','Inbox'],['habits','Life'],['projects','Works'],['journal','Diary'],['history','History'],['review','Review'],['settings','Setting']];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const day=()=>localDate(new Date());
const now=()=>new Date().toISOString();
const isoDay=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?String(v||'').slice(0,10):localDate(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const placeLabel=v=>v==='out'?'外出時':'在宅時';
function fresh(){return{version:4,tasks:[],inbox:[],habits:[{id:uid(),name:'朝食',target:7,logs:{}},{id:uid(),name:'読書',target:5,logs:{}}],projects:[{id:uid(),name:'研究',sessions:[]},{id:uid(),name:'読書',sessions:[]}],journal:[]}}
function normalize(o){
  const s=o&&typeof o==='object'?o:fresh();
  s.version=4;s.tasks=Array.isArray(s.tasks)?s.tasks:[];s.inbox=Array.isArray(s.inbox)?s.inbox:[];s.habits=Array.isArray(s.habits)?s.habits:[];s.projects=Array.isArray(s.projects)?s.projects:[];s.journal=Array.isArray(s.journal)?s.journal:[];
  s.tasks.forEach(t=>{if(!t.place)t.place=(t.focus==='out'?'out':'home');if(!t.minutes)t.minutes=20});
  s.habits.forEach(h=>{h.logs=h.logs&&typeof h.logs==='object'?h.logs:{}});
  s.projects.forEach(p=>{p.sessions=Array.isArray(p.sessions)?p.sessions:[]});
  return s;
}
let S;
try{S=normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=fresh()}
let currentProject=S.projects[0]?.id||null;
let diaryDate=day();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function show(id){
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.dataset.p===id));
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));
  render(id);
}
function render(id){({today,inbox,habits,projects,journal,history,review,settings}[id]||(()=>{}))()}
function taskMeta(t){return `<div class="taskmeta"><span class="pill">${+t.minutes||20}分</span><span class="pill">${placeLabel(t.place)}</span>${t.category?`<span class="pill">${esc(t.category)}</span>`:''}${t.due?`<span class="pill">期限 ${esc(t.due)}</span>`:''}</div>`}
function latestProjectSessions(){return S.projects.map(p=>({p,s:[...(p.sessions||[])].sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]})).filter(x=>x.s)}
function scoreTask(t){
  let score=0,today=day();
  if(t.due){if(t.due<today)score+=10000;else if(t.due===today)score+=8000;else score+=Math.max(0,4000-Math.floor((new Date(t.due)-new Date(today))/86400000)*100)}
  const age=t.createdAt?Math.max(0,Math.floor((Date.now()-new Date(t.createdAt).getTime())/86400000)):0;
  score+=Math.min(age,60)*10;score-=Math.min(+t.minutes||20,180);
  return score;
}
function whatNext(minutes,place){
  const pending=S.tasks.filter(t=>!t.done&&t.place===place);
  const fits=pending.filter(t=>(+t.minutes||20)<=minutes).sort((a,b)=>scoreTask(b)-scoreTask(a));
  if(fits[0])return{kind:'task',task:fits[0]};
  if(pending.length){const shortest=[...pending].sort((a,b)=>(+a.minutes||20)-(+b.minutes||20))[0];return{kind:'tooLong',task:shortest}}
  const latest=latestProjectSessions().sort((a,b)=>String(b.s.at).localeCompare(String(a.s.at)))[0];
  if(latest?.s?.next)return{kind:'project',project:latest.p,session:latest.s};
  return{kind:'none'};
}
function today(){
  const p=$('[data-p=today]');
  const pending=S.tasks.filter(t=>!t.done);
  const last=latestProjectSessions();
  p.innerHTML=`<div class="grid">
    <div class="card" id="whatNextCard"><h2>今から何する？</h2><p class="muted">場所と空き時間から、今やる候補を1つに絞ります。</p><div class="row"><select id="wnPlace"><option value="home">在宅時</option><option value="out">外出時</option></select><select id="wnMinutes"><option value="10">10分</option><option value="20" selected>20分</option><option value="30">30分</option><option value="60">60分</option><option value="90">90分</option></select><button id="wnGo" class="primary">今から何する？</button></div><div id="wnResult" style="margin-top:10px"></div></div>
    <div class="card half"><h2>今日</h2><div class="stack"><input id="newTask" placeholder="今日やること"><div class="row"><select id="mins"><option>10</option><option selected>20</option><option>30</option><option>60</option><option>90</option></select><select id="quickPlace"><option value="home">在宅時</option><option value="out">外出時</option></select><button class="primary" id="addTask">追加</button></div></div><div id="tasks">${pending.map(t=>`<div class="item"><div class="manage"><div><b>${esc(t.text)}</b>${taskMeta(t)}</div><button class="primary smallbtn" data-complete="${t.id}">完了</button></div></div>`).join('')||'<div class="muted item">未完了タスクなし</div>'}</div></div>
    <div class="card half"><h3>前回の続き</h3>${last.map(x=>`<div class="item"><b>${esc(x.p.name)}</b><div class="muted">${new Date(x.s.at).toLocaleString('ja-JP')}</div><div>${esc(x.s.next||'次の一手未記録')}</div><button data-open="${x.p.id}">続きから開く</button></div>`).join('')||'<div class="muted">まだ記録なし</div>'}</div>
    <div class="card"><h3>習慣</h3>${S.habits.map(h=>`<button data-habit="${h.id}" class="${h.logs?.[day()]?'primary':''}">${h.logs?.[day()]?'✓ ':''}${esc(h.name)}</button>`).join(' ')||'<div class="muted">習慣なし</div>'}</div>
  </div>`;
  $('#wnGo').onclick=()=>{const r=whatNext(+$('#wnMinutes').value,$('#wnPlace').value),box=$('#wnResult');if(r.kind==='task')box.innerHTML=`<div class="resume"><b>${esc(r.task.text)}</b>${taskMeta(r.task)}<div class="muted" style="margin-top:7px">期限・滞留期間・所要時間から優先しています。</div></div>`;else if(r.kind==='tooLong')box.innerHTML=`<div class="resume">${placeLabel(r.task.place)}のタスクはありますが、指定時間内で終わるものがありません。<div class="muted">最短: ${esc(r.task.text)}（${+r.task.minutes||20}分）</div></div>`;else if(r.kind==='project')box.innerHTML=`<div class="resume"><b>${esc(r.project.name)}を再開</b><div>${esc(r.session.next)}</div><div class="muted">該当タスクがないため、前回のWorksの次の一手を提示しました。</div></div>`;else box.innerHTML='<div class="resume">今の条件で提案できる未完了タスクやWorksの次の一手はありません。</div>'};
  $('#addTask').onclick=()=>{const text=$('#newTask').value.trim();if(!text)return;S.tasks.push({id:uid(),text,minutes:+$('#mins').value||20,place:$('#quickPlace').value,createdAt:now(),done:false});save();today()};
  p.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.complete);if(!t)return;t.done=true;t.doneAt=now();save();today()});
  p.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{currentProject=b.dataset.open;show('projects')});
  p.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{const h=S.habits.find(x=>x.id===b.dataset.habit);if(!h)return;h.logs=h.logs||{};if(h.logs[day()])delete h.logs[day()];else h.logs[day()]=now();save();today()});
}
function inbox(){
  const p=$('[data-p=inbox]');
  p.innerHTML=`<div class="grid"><div class="card half"><h2>Inbox</h2><p class="muted">思いつきを未整理のまま置く場所です。</p><div class="row"><input id="ib" placeholder="思いつきをそのまま入力"><button id="ibAdd" class="primary">追加</button></div><h3 style="margin-top:16px">未整理</h3>${S.inbox.map((x,i)=>`<div class="item"><b>${esc(typeof x==='string'?x:x.text)}</b><div style="margin-top:7px"><button data-taskify="${i}">詳細タスクへ転記</button></div></div>`).join('')||'<div class="muted item">未整理項目なし</div>'}</div><div class="card half"><h2>詳細タスクを追加</h2><p class="muted" id="ibSource">未整理項目をここへ転記して編集してから、未完了タスクへ追加できます。</p><input id="ibIndex" type="hidden" value=""><div class="stack"><input id="dtText" placeholder="タスク名"><div class="row"><select id="dtMinutes"><option value="5">5分</option><option value="10">10分</option><option value="20" selected>20分</option><option value="30">30分</option><option value="60">60分</option><option value="90">90分</option></select><select id="dtPlace"><option value="home">在宅時</option><option value="out">外出時</option></select></div><input id="dtCategory" placeholder="分類（例：家事・買い物・手続き）"><label class="muted">期限<input id="dtDue" type="date"></label><div class="row"><button id="dtAdd" class="primary">未完了タスクに追加</button><button id="dtClear">入力をクリア</button></div></div><h3 style="margin-top:18px">未完了タスク</h3>${S.tasks.filter(t=>!t.done).map(t=>`<div class="item"><b>${esc(t.text)}</b>${taskMeta(t)}</div>`).join('')||'<div class="muted item">未完了タスクなし</div>'}</div></div>`;
  $('#ibAdd').onclick=()=>{const v=$('#ib').value.trim();if(!v)return;S.inbox.push(v);save();inbox()};
  p.querySelectorAll('[data-taskify]').forEach(b=>b.onclick=()=>{const i=+b.dataset.taskify,v=S.inbox[i],text=typeof v==='string'?v:v?.text||'';$('#dtText').value=text;$('#ibIndex').value=String(i);$('#ibSource').textContent=`未整理から転記中：${text}`;$('#dtText').focus()});
  $('#dtClear').onclick=()=>{['dtText','dtCategory','dtDue','ibIndex'].forEach(id=>$('#'+id).value='');$('#dtMinutes').value='20';$('#dtPlace').value='home';$('#ibSource').textContent='未整理項目をここへ転記して編集してから、未完了タスクへ追加できます。'};
  $('#dtAdd').onclick=()=>{const text=$('#dtText').value.trim();if(!text)return;S.tasks.push({id:uid(),text,minutes:+$('#dtMinutes').value||20,place:$('#dtPlace').value,category:$('#dtCategory').value.trim(),due:$('#dtDue').value||'',createdAt:now(),done:false});const src=$('#ibIndex').value;if(src!==''&&S.inbox[+src]!==undefined)S.inbox.splice(+src,1);save();inbox()};
}
function habits(){
  const p=$('[data-p=habits]');
  p.innerHTML=`<div class="grid"><div class="card half"><h2>Life</h2><p class="muted">生活習慣の記録と実行率。</p>${S.habits.map(h=>`<div class="item"><div class="manage"><div><b>${esc(h.name)}</b><div class="muted">目標 週${h.target}回 / 全記録 ${Object.keys(h.logs||{}).length}回</div></div><button class="danger smallbtn" data-delhabit="${h.id}">削除</button></div></div>`).join('')||'<div class="muted item">習慣なし</div>'}</div><div class="card half"><h3>習慣を追加</h3><div class="stack"><input id="hn" placeholder="習慣名"><select id="ht"><option value="3">週3回</option><option value="5">週5回</option><option value="7">毎日</option></select><button id="ha" class="primary">追加</button></div></div></div>`;
  $('#ha').onclick=()=>{const n=$('#hn').value.trim();if(!n)return;S.habits.push({id:uid(),name:n,target:+$('#ht').value,logs:{}});save();habits()};
  p.querySelectorAll('[data-delhabit]').forEach(b=>b.onclick=()=>{const h=S.habits.find(x=>x.id===b.dataset.delhabit);if(!h)return;if(!confirm(`習慣「${h.name}」を削除しますか？\nこれまでの実行記録も削除されます。`))return;S.habits=S.habits.filter(x=>x.id!==h.id);save();habits()});
}
function projects(){
  const p=$('[data-p=projects]');let x=S.projects.find(z=>z.id===currentProject)||S.projects[0]||null;currentProject=x?.id||null;const last=x?[...(x.sessions||[])].sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]:null;
  p.innerHTML=`<div class="grid"><div class="card half"><h2>Works</h2><p class="muted">続きを残したい作業をプロジェクト単位で管理します。</p><div class="row">${S.projects.map(z=>`<button data-pr="${z.id}" class="${z.id===currentProject?'primary':''}">${esc(z.name)}</button>`).join('')}</div><hr><div class="row"><input id="pn" placeholder="新規プロジェクト名"><button id="pa" class="primary">追加</button></div><h3 style="margin-top:18px">プロジェクト管理</h3>${S.projects.map(z=>`<div class="item"><div class="manage"><span>${esc(z.name)}</span><button class="danger smallbtn" data-delproject="${z.id}">削除</button></div></div>`).join('')||'<div class="muted item">プロジェクトなし</div>'}</div><div class="card half">${x?`<h2>${esc(x.name)}</h2>${last?`<div class="resume"><b>前回の続き</b><br><span class="muted">${new Date(last.at).toLocaleString('ja-JP')}</span><p><b>やったこと</b><br>${esc(last.done)}</p><p><b>考えていたこと</b><br>${esc(last.thinking)}</p><p><b>次の一手</b><br>${esc(last.next)}</p></div>`:'<div class="resume">まだ記録なし</div>'}<div class="stack" style="margin-top:12px"><textarea id="pd" placeholder="今日やったこと"></textarea><textarea id="pth" placeholder="今考えていること"></textarea><textarea id="pnx" placeholder="次に見る場所・次の一手"></textarea><label class="muted">作業時間（分）<input id="pm" type="number" value="30" min="0" max="600"></label><button id="ps" class="primary">終了メモを保存</button></div><h3 style="margin-top:16px">過去の思考履歴</h3>${[...(x.sessions||[])].sort((a,b)=>String(b.at).localeCompare(String(a.at))).map(s=>`<div class="item"><span class="muted">${new Date(s.at).toLocaleString('ja-JP')} ・ ${s.minutes||0}分</span><p><b>やったこと</b><br>${esc(s.done)}</p><p><b>考えていたこと</b><br>${esc(s.thinking)}</p><p><b>次の一手</b><br>${esc(s.next)}</p></div>`).join('')}`:'<div class="muted">プロジェクトなし</div>'}</div></div>`;
  p.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{currentProject=b.dataset.pr;projects()});
  $('#pa').onclick=()=>{const n=$('#pn').value.trim();if(!n)return;const id=uid();S.projects.push({id,name:n,sessions:[]});currentProject=id;save();projects()};
  p.querySelectorAll('[data-delproject]').forEach(b=>b.onclick=()=>{const pr=S.projects.find(z=>z.id===b.dataset.delproject);if(!pr)return;if(!confirm(`Works「${pr.name}」を削除しますか？\nこれまでの思考履歴・作業記録も削除されます。`))return;S.projects=S.projects.filter(z=>z.id!==pr.id);if(currentProject===pr.id)currentProject=S.projects[0]?.id||null;save();projects()});
  if(x&&$('#ps'))$('#ps').onclick=()=>{const done=$('#pd').value.trim(),thinking=$('#pth').value.trim(),next=$('#pnx').value.trim();if(!done&&!thinking&&!next)return;x.sessions.push({id:uid(),at:now(),done,thinking,next,minutes:+$('#pm').value||0});save();projects()};
}
function journal(dateArg){
  const p=$('[data-p=journal]');if(dateArg)diaryDate=dateArg;if(!diaryDate||diaryDate>day())diaryDate=day();const entry=S.journal.find(x=>x.date===diaryDate)||{};
  p.innerHTML=`<div class="grid"><div class="card half"><h2>Diary</h2><label class="muted">記録する日付<input id="jdate" type="date" max="${day()}" value="${esc(diaryDate)}"></label><div class="stack" style="margin-top:10px"><textarea id="jd" placeholder="その日にやったこと">${esc(entry.done)}</textarea><textarea id="js" placeholder="気分・疲労・集中">${esc(entry.state)}</textarea><textarea id="jn" placeholder="気づき・考え">${esc(entry.note)}</textarea><textarea id="jx" placeholder="次の日・次回の最初の一手">${esc(entry.next)}</textarea><button id="jSave" class="primary">${entry.date?'この日の日記を更新':'この日の日記を保存'}</button></div></div><div class="card half"><h3>過去の日記</h3><p class="muted">「参照・編集」を押すと、その日の内容を左側に読み込みます。</p>${[...S.journal].sort((a,b)=>b.date.localeCompare(a.date)).map(j=>`<div class="item"><div class="manage"><div><b>${j.date}</b><div class="muted">${esc((j.note||j.done||j.state||'').slice(0,80))}</div></div><button class="smallbtn" data-jedit="${j.date}">参照・編集</button></div></div>`).join('')||'<div class="muted item">まだ日記なし</div>'}</div></div>`;
  $('#jdate').onchange=()=>{const d=$('#jdate').value;if(d&&d<=day()){diaryDate=d;journal()}};
  p.querySelectorAll('[data-jedit]').forEach(b=>b.onclick=()=>{diaryDate=b.dataset.jedit;journal();window.scrollTo({top:0,behavior:'smooth'})});
  $('#jSave').onclick=()=>{const date=$('#jdate').value;if(!date||date>day())return;const o={date,done:$('#jd').value.trim(),state:$('#js').value.trim(),note:$('#jn').value.trim(),next:$('#jx').value.trim()};const i=S.journal.findIndex(x=>x.date===date);if(i>=0)S.journal[i]=o;else S.journal.push(o);diaryDate=date;save();journal()};
}
function historyRows(){const a=[];S.tasks.forEach(t=>a.push({type:'Task',date:isoDay(t.doneAt||t.createdAt),title:t.text,body:[t.done?'完了':'未完了',placeLabel(t.place),t.category||'',t.due?`期限 ${t.due}`:''].join(' ')}));S.projects.forEach(p=>(p.sessions||[]).forEach(s=>a.push({type:'Works',date:isoDay(s.at),title:p.name,body:[s.done,s.thinking,s.next,`${s.minutes||0}分`].join(' ')})));S.journal.forEach(j=>a.push({type:'Diary',date:j.date,title:j.date,body:[j.done,j.state,j.note,j.next].join(' ')}));S.habits.forEach(h=>Object.keys(h.logs||{}).forEach(d=>a.push({type:'Life',date:d,title:h.name,body:'実行'})));return a.sort((x,y)=>y.date.localeCompare(x.date))}
function history(){const p=$('[data-p=history]');p.innerHTML=`<div class="card"><h2>History</h2><div class="stack"><input id="hq" placeholder="Diary・Works・Task・Lifeを横断検索"><div class="row"><select id="htype"><option value="">すべて</option><option>Task</option><option>Works</option><option>Diary</option><option>Life</option></select><input id="hfrom" type="date"><input id="hto" type="date"></div><div id="hr"></div></div></div>`;const go=()=>{const q=$('#hq').value.toLowerCase(),ty=$('#htype').value,from=$('#hfrom').value,to=$('#hto').value;const rows=historyRows().filter(x=>(!q||(x.title+' '+x.body+' '+x.type).toLowerCase().includes(q))&&(!ty||x.type===ty)&&(!from||x.date>=from)&&(!to||x.date<=to));$('#hr').innerHTML=rows.slice(0,500).map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="pill">${x.type}</span><div class="muted">${x.date}</div><div>${esc(x.body)}</div></div>`).join('')||'<div class="muted item">該当なし</div>'};['hq','htype','hfrom','hto'].forEach(id=>$('#'+id).addEventListener(id==='hq'?'input':'change',go));go()}
function review(){const p=$('[data-p=review]'),d=new Date(),cut=new Date(d.getFullYear(),d.getMonth(),d.getDate()-6),cutKey=localDate(cut);const done=S.tasks.filter(x=>x.done&&isoDay(x.doneAt)>=cutKey).length;const sessions=S.projects.flatMap(x=>(x.sessions||[]).map(s=>({p:x,s}))).filter(x=>isoDay(x.s.at)>=cutKey);const minutes=sessions.reduce((n,x)=>n+(+x.s.minutes||0),0);const journals=S.journal.filter(x=>x.date>=cutKey&&x.date<=day());const tired=journals.filter(x=>/疲|眠|集中でき|だる|しんど/.test((x.state||'')+' '+(x.note||''))).length;const stale=S.tasks.filter(x=>!x.done&&isoDay(x.createdAt)<cutKey).length;const habitLogs=S.habits.reduce((n,h)=>n+Object.keys(h.logs||{}).filter(dt=>dt>=cutKey&&dt<=day()).length,0);const targets=S.habits.reduce((n,h)=>n+Math.min(7,+h.target||0),0),pct=targets?Math.round(habitLogs/targets*100):0;const ideas=[];if(tired>=2)ideas.push('この7日間の日記に疲労・眠気・集中低下の記述が複数あります。高負荷のWorksを状態のよい時間帯へ移す候補があります。');if(stale>=2)ideas.push(`7日以上未完了のタスクが${stale}件あります。所要時間を小さく分解するか、不要なら削除候補にしてください。`);if(sessions.length===0&&S.projects.length)ideas.push('この7日間にWorksの終了メモがありません。15〜20分だけ「前回の続き」から再開する方法があります。');if(pct<50&&targets)ideas.push(`Lifeの7日間実行率は約${pct}%です。実行しにくい習慣を1つ選び、開始条件を固定する余地があります。`);if(!ideas.length)ideas.push('現時点では強い停滞パターンを検出していません。記録が増えるほど曜日・疲労・タスク種類との関係を見やすくなります。');p.innerHTML=`<div class="grid"><div class="card half"><h2>Review</h2><p class="muted">APK内で動作する端末内ルール判定です。</p><div class="item">完了タスク <b>${done}</b></div><div class="item">Works <b>${sessions.length}</b>回 / <b>${minutes}</b>分</div><div class="item">Diary <b>${journals.length}</b>日</div><div class="item">Life実行率 <b>${pct}%</b></div></div><div class="card half"><h3>改善候補</h3>${ideas.map(x=>`<div class="resume" style="margin-bottom:9px">${esc(x)}</div>`).join('')}</div></div>`}
function buildMarkdown(range){let from='0000-01-01',to=day();if(range!=='all'){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(+range-1));from=localDate(d)}const tasks=S.tasks.filter(t=>{const d=isoDay(t.doneAt||t.createdAt);return d>=from&&d<=to});const journal=[...S.journal].filter(j=>j.date>=from&&j.date<=to).sort((a,b)=>a.date.localeCompare(b.date));const projects=S.projects.map(p=>({...p,sessions:(p.sessions||[]).filter(s=>{const d=isoDay(s.at);return d>=from&&d<=to}).sort((a,b)=>String(a.at).localeCompare(String(b.at)))})).filter(p=>p.sessions.length);const lines=['# Life OS export for ChatGPT','',`- Exported: ${new Date().toLocaleString('ja-JP')}`,`- Period: ${range==='all'?'all records':from+' to '+to}`,'','## Analysis request','この記録を事実と推測を分けて分析してください。反復パターン、生活上の障害、うまくいっている条件、先延ばしの条件、Worksの継続性、未処理タスクの偏りを検討し、根拠のある改善案を提示してください。','',`## Summary counts`,`- Tasks: ${tasks.length}`,`- Completed tasks: ${tasks.filter(t=>t.done).length}`,`- Diary days: ${journal.length}`,`- Works sessions: ${projects.reduce((n,p)=>n+p.sessions.length,0)}`,'','## Diary'];if(!journal.length)lines.push('_No diary entries._');journal.forEach(j=>{lines.push(`### ${j.date}`);if(j.done)lines.push(`- やったこと: ${j.done}`);if(j.state)lines.push(`- 気分・疲労・集中: ${j.state}`);if(j.note)lines.push(`- 気づき・考え: ${j.note}`);if(j.next)lines.push(`- 次の一手: ${j.next}`);lines.push('')});lines.push('## Works');if(!projects.length)lines.push('_No work sessions._');projects.forEach(p=>{lines.push(`### ${p.name}`);p.sessions.forEach(s=>{lines.push(`#### ${new Date(s.at).toLocaleString('ja-JP')} (${s.minutes||0} min)`);if(s.done)lines.push(`- やったこと: ${s.done}`);if(s.thinking)lines.push(`- 考えていたこと: ${s.thinking}`);if(s.next)lines.push(`- 次の一手: ${s.next}`);lines.push('')})});lines.push('## Life');S.habits.forEach(h=>{const dates=Object.keys(h.logs||{}).filter(d=>d>=from&&d<=to).sort();lines.push(`### ${h.name}`,`- 週目標: ${h.target||0}回`,`- 実行日: ${dates.length?dates.join(', '):'なし'}`,'')});lines.push('## Tasks');if(!tasks.length)lines.push('_No tasks._');tasks.forEach(t=>{lines.push(`- [${t.done?'x':' '}] ${t.text}`,`  - created: ${isoDay(t.createdAt)}`,`  - minutes: ${t.minutes||20}`,`  - place: ${placeLabel(t.place)}`);if(t.doneAt)lines.push(`  - completed: ${isoDay(t.doneAt)}`);if(t.category)lines.push(`  - category: ${t.category}`);if(t.due)lines.push(`  - due: ${t.due}`)});lines.push('','## Inbox');if(!S.inbox.length)lines.push('_Empty._');else S.inbox.forEach(x=>lines.push(`- ${typeof x==='string'?x:x.text||''}`));return lines.join('\n')}
function settings(){const p=$('[data-p=settings]');p.innerHTML=`<div class="grid"><div class="card"><h2>Setting</h2><p class="muted">履歴は端末内とAndroidバックアップ対象領域に保存します。機種変更・再インストールに備えてJSONも併用してください。</p><div class="row"><button id="ex" class="primary">JSONを書き出す</button><button id="im">JSONを読み込む</button></div></div><div class="card"><h2>ChatGPT用エクスポート</h2><p class="muted">Diary・Works・Life・Task・InboxをMarkdownにまとめます。</p><div class="row"><select id="aiRange"><option value="7">直近7日</option><option value="30" selected>直近30日</option><option value="90">直近90日</option><option value="all">全期間</option></select><button id="aiExport" class="primary">Markdownを書き出す</button></div></div></div>`;$('#ex').onclick=()=>window.AndroidBridge?.exportBackup(JSON.stringify(S,null,2));$('#im').onclick=()=>window.AndroidBridge?.importBackup();$('#aiExport').onclick=()=>window.AndroidBridge?.exportForAI(buildMarkdown($('#aiRange').value))}
window.receiveImportedBackupBase64=b=>{try{const txt=new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));S=normalize(JSON.parse(txt));save();currentProject=S.projects[0]?.id||null;diaryDate=day();show('today')}catch(e){window.AndroidBridge?.toast('読み込みに失敗しました')}};
$('#date').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
$('#nav').innerHTML=tabs.map((x,i)=>`<button data-tab="${x[0]}" class="${i?'':'on'}">${x[1]}</button>`).join('');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
save();today();
})();
</script>
