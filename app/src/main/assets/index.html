<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life OS</title>
<style>
:root{--bg:#f4f1eb;--p:#fff;--t:#202326;--m:#6d7479;--l:#ded9cf;--a:#455a64}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,-apple-system,sans-serif}.app{max-width:900px;margin:auto;padding:14px 12px 80px}nav{display:flex;gap:7px;overflow:auto;margin:10px 0 14px}button,input,textarea,select{font:inherit}button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:9px 12px;min-height:42px}button.on,.primary{background:var(--a);color:#fff}input,textarea,select{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}textarea{min-height:88px}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 12;background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.half{grid-column:span 6}.muted{color:var(--m);font-size:13px}.item{padding:10px 0;border-top:1px solid #eee}.item:first-child{border-top:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{font-size:12px;background:#edf0f1;border-radius:999px;padding:2px 7px}.resume{border-left:3px solid var(--a);background:#f4f6f6;padding:11px;border-radius:8px}.stack{display:grid;gap:9px}h2,h3{margin:0 0 10px}@media(max-width:680px){.half{grid-column:span 12}}
</style></head><body><div class="app"><h1 style="margin:4px 0 0;font-size:24px">Life OS</h1><div class="muted" id="date"></div><nav id="nav"></nav>
<section class="panel on" data-p="today"></section><section class="panel" data-p="inbox"></section><section class="panel" data-p="habits"></section><section class="panel" data-p="projects"></section><section class="panel" data-p="journal"></section><section class="panel" data-p="history"></section><section class="panel" data-p="review"></section><section class="panel" data-p="settings"></section></div>
<script>
(()=>{const K='lifeos_v1',tabs=[['today','Today'],['inbox','Inbox'],['habits','習慣'],['projects','研究・読書'],['journal','日記'],['history','履歴'],['review','Review'],['settings','設定']],$=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),day=()=>new Date().toISOString().slice(0,10),now=()=>new Date().toISOString(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return{version:1,tasks:[],inbox:[],habits:[{id:uid(),name:'朝食',target:7,logs:{}},{id:uid(),name:'読書',target:5,logs:{}}],projects:[{id:uid(),name:'研究',type:'研究',sessions:[]},{id:uid(),name:'読書',type:'読書',sessions:[]}],journal:[]}}
let S;try{S=JSON.parse(localStorage.getItem(K))||fresh()}catch(e){S=fresh()}let cp=S.projects[0]?.id;const save=()=>localStorage.setItem(K,JSON.stringify(S));
$('#date').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('#nav').innerHTML=tabs.map((x,i)=>`<button data-tab="${x[0]}" class="${i?'':'on'}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.dataset.p===id));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));render(id)}
function render(id){({today,inbox,habits,projects,journal,history,review,settings}[id]||(()=>{}))()}
function today(){const p=$('[data-p=today]'),last=S.projects.map(x=>({p:x,s:[...(x.sessions||[])].sort((a,b)=>b.at.localeCompare(a.at))[0]})).filter(x=>x.s);p.innerHTML=`<div class="grid"><div class="card half"><h2>今日</h2><div class="stack"><input id="newTask" placeholder="今日やること"><div class="row"><select id="mins"><option>10</option><option selected>20</option><option>30</option><option>60</option></select><select id="focus"><option value="low">低集中</option><option value="mid" selected>普通</option><option value="high">高集中</option></select><button class="primary" id="addTask">追加</button></div></div><div id="tasks">${S.tasks.filter(t=>!t.done).map(t=>`<div class="item"><label><input type="checkbox" data-done="${t.id}"> ${esc(t.text)}</label> <span class="pill">${t.minutes}分</span></div>`).join('')||'<div class="muted item">未完了タスクなし</div>'}</div></div><div class="card half"><h3>前回の続き</h3>${last.map(x=>`<div class="item"><b>${esc(x.p.name)}</b><div>${esc(x.s.next||'次の一手未記録')}</div><button data-open="${x.p.id}">続きから開く</button></div>`).join('')||'<div class="muted">まだ記録なし</div>'}</div><div class="card"><h3>習慣</h3>${S.habits.map(h=>`<button data-habit="${h.id}">${h.logs[day()]?'✓ ':''}${esc(h.name)}</button>`).join(' ')}</div></div>`;$('#addTask').onclick=()=>{const v=$('#newTask').value.trim();if(!v)return;S.tasks.push({id:uid(),text:v,minutes:+$('#mins').value,focus:$('#focus').value,createdAt:now(),done:false});save();today()};document.querySelectorAll('[data-done]').forEach(c=>c.onchange=()=>{const t=S.tasks.find(x=>x.id===c.dataset.done);t.done=true;t.doneAt=now();save();today()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{cp=b.dataset.open;show('projects')});document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{const h=S.habits.find(x=>x.id===b.dataset.habit);h.logs[day()]?delete h.logs[day()]:h.logs[day()]=now();save();today()})}
function inbox(){const p=$('[data-p=inbox]');p.innerHTML=`<div class="card"><h2>Inbox</h2><div class="row"><input id="ib" placeholder="思いつきをそのまま入力"><button id="ibAdd" class="primary">追加</button></div>${S.inbox.map((x,i)=>`<div class="item">${esc(x)} <button data-taskify="${i}">タスク化</button></div>`).join('')}</div>`;$('#ibAdd').onclick=()=>{const v=$('#ib').value.trim();if(v){S.inbox.push(v);save();inbox()}};document.querySelectorAll('[data-taskify]').forEach(b=>b.onclick=()=>{const v=S.inbox.splice(+b.dataset.taskify,1)[0];S.tasks.push({id:uid(),text:v,minutes:20,focus:'low',createdAt:now(),done:false});save();inbox()})}
function habits(){const p=$('[data-p=habits]');p.innerHTML=`<div class="grid"><div class="card half"><h2>習慣</h2>${S.habits.map(h=>`<div class="item"><b>${esc(h.name)}</b><div class="muted">今週目標 ${h.target}回 / 記録 ${Object.keys(h.logs||{}).length}回</div></div>`).join('')}</div><div class="card half"><h3>追加</h3><input id="hn" placeholder="習慣名"><select id="ht"><option value="3">週3回</option><option value="5">週5回</option><option value="7">毎日</option></select><button id="ha">追加</button></div></div>`;$('#ha').onclick=()=>{const n=$('#hn').value.trim();if(n){S.habits.push({id:uid(),name:n,target:+$('#ht').value,logs:{}});save();habits()}}}
function projects(){const p=$('[data-p=projects]'),x=S.projects.find(z=>z.id===cp)||S.projects[0];cp=x?.id;const last=x?[...(x.sessions||[])].sort((a,b)=>b.at.localeCompare(a.at))[0]:null;p.innerHTML=`<div class="grid"><div class="card half"><h2>Projects</h2>${S.projects.map(z=>`<button data-pr="${z.id}" class="${z.id===cp?'primary':''}">${esc(z.name)}</button>`).join(' ')}<hr><input id="pn" placeholder="新規プロジェクト"><select id="pt"><option>研究</option><option>読書</option><option>趣味</option><option>生活</option></select><button id="pa">追加</button></div><div class="card half">${x?`<h2>${esc(x.name)}</h2>${last?`<div class="resume"><b>前回の続き</b><br><span class="muted">${new Date(last.at).toLocaleString('ja-JP')}</span><p><b>やったこと</b><br>${esc(last.done)}</p><p><b>考えていたこと</b><br>${esc(last.thinking)}</p><p><b>次の一手</b><br>${esc(last.next)}</p></div>`:'<div class="resume">まだ記録なし</div>'}<div class="stack" style="margin-top:12px"><textarea id="pd" placeholder="今日やったこと"></textarea><textarea id="pth" placeholder="今考えていること"></textarea><textarea id="pnx" placeholder="次に見る場所・次の一手"></textarea><input id="pm" type="number" value="30" min="0" max="600"><button id="ps" class="primary">終了メモを保存</button></div><h3 style="margin-top:16px">過去の思考履歴</h3>${[...(x.sessions||[])].sort((a,b)=>b.at.localeCompare(a.at)).map(s=>`<div class="item"><span class="muted">${new Date(s.at).toLocaleString('ja-JP')}</span><br>${esc(s.thinking||s.done||s.next)}</div>`).join('')}`:'プロジェクトなし'}</div></div>`;document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{cp=b.dataset.pr;projects()});$('#pa').onclick=()=>{const n=$('#pn').value.trim();if(n){const id=uid();S.projects.push({id,name:n,type:$('#pt').value,sessions:[]});cp=id;save();projects()}};if(x)$('#ps').onclick=()=>{const done=$('#pd').value.trim(),thinking=$('#pth').value.trim(),next=$('#pnx').value.trim();if(!done&&!thinking&&!next)return;x.sessions.push({id:uid(),at:now(),done,thinking,next,minutes:+$('#pm').value||0});save();projects()}}
function journal(){const p=$('[data-p=journal]'),k=day(),j=S.journal.find(x=>x.date===k)||{};p.innerHTML=`<div class="grid"><div class="card half"><h2>日記</h2><div class="stack"><textarea id="jd" placeholder="今日やったこと">${esc(j.done)}</textarea><textarea id="js" placeholder="気分・疲労・集中">${esc(j.state)}</textarea><textarea id="jn" placeholder="気づき・考え">${esc(j.note)}</textarea><textarea id="jx" placeholder="明日の最初の一手">${esc(j.next)}</textarea><button id="jSave" class="primary">保存</button></div></div><div class="card half"><h3>最近の日記</h3>${[...S.journal].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20).map(x=>`<div class="item"><b>${x.date}</b><br>${esc(x.note||x.done||x.state)}</div>`).join('')}</div></div>`;$('#jSave').onclick=()=>{const o={date:k,done:$('#jd').value.trim(),state:$('#js').value.trim(),note:$('#jn').value.trim(),next:$('#jx').value.trim()};const i=S.journal.findIndex(x=>x.date===k);i>=0?S.journal[i]=o:S.journal.push(o);save();journal()}}
function rows(){let a=[];S.tasks.forEach(t=>a.push({type:'タスク',date:(t.doneAt||t.createdAt).slice(0,10),title:t.text,body:t.done?'完了':'未完了'}));S.projects.forEach(p=>(p.sessions||[]).forEach(s=>a.push({type:p.type,date:s.at.slice(0,10),title:p.name,body:[s.done,s.thinking,s.next].join(' ')})));S.journal.forEach(j=>a.push({type:'日記',date:j.date,title:j.date,body:[j.done,j.state,j.note,j.next].join(' ')}));return a.sort((x,y)=>y.date.localeCompare(x.date))}
function history(){const p=$('[data-p=history]');p.innerHTML=`<div class="card"><h2>履歴</h2><input id="hq" placeholder="日記・研究・読書・タスクを横断検索"><div id="hr"></div></div>`;const go=()=>{const q=$('#hq').value.toLowerCase();$('#hr').innerHTML=rows().filter(x=>!q||(x.title+' '+x.body).toLowerCase().includes(q)).slice(0,300).map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="pill">${esc(x.type)}</span><div class="muted">${x.date}</div><div>${esc(x.body)}</div></div>`).join('')||'<div class="muted item">該当なし</div>'};$('#hq').oninput=go;go()}
function review(){const p=$('[data-p=review]'),done=S.tasks.filter(x=>x.done).length,sessions=S.projects.reduce((n,x)=>n+(x.sessions||[]).length,0),tired=S.journal.filter(x=>/疲|眠|集中でき/.test((x.state||'')+' '+(x.note||''))).length;p.innerHTML=`<div class="grid"><div class="card half"><h2>Review</h2><div class="item">完了タスク <b>${done}</b></div><div class="item">思考セッション <b>${sessions}</b></div><div class="item">日記 <b>${S.journal.length}</b>日</div></div><div class="card half"><h3>改善候補</h3>${tired>=2?'<div class="resume">疲労・集中低下の記述が複数あります。高集中作業を午前へ移す候補があります。</div>':'<div class="resume">記録が増えると、反復する停滞や生活条件から改善候補を出します。</div>'}</div></div>`}
function settings(){const p=$('[data-p=settings]');p.innerHTML=`<div class="card"><h2>設定・バックアップ</h2><p class="muted">記録は端末内に保存。定期的にJSONを書き出してください。</p><div class="row"><button id="ex" class="primary">JSONを書き出す</button><button id="im">JSONを読み込む</button></div></div>`;$('#ex').onclick=()=>{const j=JSON.stringify(S,null,2);if(window.AndroidBridge?.exportBackup)AndroidBridge.exportBackup(j)};$('#im').onclick=()=>window.AndroidBridge?.importBackup()}
window.receiveImportedBackupBase64=b=>{try{const txt=new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))),o=JSON.parse(txt);if(!o.version)throw 0;S=o;save();cp=S.projects[0]?.id;show('today')}catch(e){window.AndroidBridge?.toast('読み込みに失敗しました')}};today();save();})();
</script></body></html>
