<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Chat</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color-scheme: light dark; }
    body { margin: 0; background: #111; color: #eee; }
    .app { max-width: 900px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 14px 16px; border-bottom: 1px solid #333; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    header strong { margin-right: auto; }
    input, button, textarea, select { font: inherit; }
    select, input, textarea { background: #1b1b1b; color: #eee; border: 1px solid #444; border-radius: 8px; }
    button { background: #2f6fed; color: white; border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; }
    button.secondary { background: #333; }
    #chat { padding: 16px; overflow-y: auto; }
    .msg { max-width: 78%; padding: 10px 12px; margin: 8px 0; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; }
    .user { margin-left: auto; background: #2f6fed; }
    .assistant { background: #222; border: 1px solid #333; }
    footer { border-top: 1px solid #333; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    textarea { resize: vertical; min-height: 62px; padding: 10px; }
    .status { font-size: 12px; color: #aaa; width: 100%; }
    @media (max-width: 640px) { .msg { max-width: 90%; } header { align-items: stretch; } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <strong>Local Chat</strong>
    <select id="model"><option>qwen3:8b</option></select>
    <button class="secondary" id="clear">履歴削除</button>
    <button class="secondary" id="export">履歴出力</button>
    <div class="status" id="status">PC内のOllamaに接続します。</div>
  </header>
  <main id="chat"></main>
  <footer>
    <textarea id="input" placeholder="メッセージ"></textarea>
    <button id="send">送信</button>
  </footer>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const model = document.getElementById('model');
const status = document.getElementById('status');

function add(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function loadHistory() {
  const r = await fetch('/api/history');
  const items = await r.json();
  chat.innerHTML = '';
  items.forEach(x => add(x.role, x.content));
}

async function loadModels() {
  try {
    const r = await fetch('/api/models');
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Ollama error');
    model.innerHTML = '';
    (data.models || []).forEach(m => {
      const o = document.createElement('option'); o.value = m.name; o.textContent = m.name; model.appendChild(o);
    });
    status.textContent = 'Ollama接続済み。推論はPC内で実行されます。';
  } catch (e) {
    status.textContent = 'Ollamaに接続できません: ' + e.message;
  }
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  add('user', text);
  status.textContent = '生成中…';
  document.getElementById('send').disabled = true;
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text, model:model.value})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'error');
    add('assistant', data.answer);
    status.textContent = `モデル: ${data.model}`;
  } catch (e) {
    add('assistant', 'エラー: ' + e.message);
    status.textContent = 'エラー';
  } finally {
    document.getElementById('send').disabled = false;
  }
}

document.getElementById('send').onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }});
document.getElementById('clear').onclick = async () => { await fetch('/api/history', {method:'DELETE'}); await loadHistory(); };
document.getElementById('export').onclick = async () => {
  const r = await fetch('/api/export'); const data = await r.json();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'local-chat-history.json'; a.click(); URL.revokeObjectURL(a.href);
};
loadHistory(); loadModels();
</script>
</body>
</html>
